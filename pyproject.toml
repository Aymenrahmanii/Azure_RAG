[project]
name = "azure-rag"
version = "0.1.0"
description = "EU regulatory compliance assistant: baseline RAG, GraphRAG and Agentic RAG on Azure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rank-bm25>=0.2.2",
    "azure-identity>=1.17",
    "azure-search-documents>=11.6",
]

[project.optional-dependencies]
local = ["chromadb>=0.5", "sentence-transformers>=3.0"]  # local embeddings, Chroma, reranker
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
